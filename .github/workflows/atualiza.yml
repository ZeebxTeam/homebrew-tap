# Mantém os casks na release mais nova do Zeebx e confere que continuam válidos.
#
# Roda todo dia e à mão, pela aba Actions. O tap se atualiza sozinho, sem nada no repositório do
# emulador: lá a release sai como rascunho e só é publicada depois de conferida, e é só aí que ela
# aparece para este script. Assim também não é preciso um token com acesso a dois repositórios.
name: atualiza

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  casks:
    # Os dois sistemas dos casks: no macOS o `audit` confere o `.dmg`, no Linux o AppImage. Os dois
    # runners já trazem o `brew`. Só o do macOS sobe a versão e commita, para não haver dois pushes.
    strategy:
      fail-fast: false
      matrix:
        sistema: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v5

      - name: Sobe para a release mais nova
        if: runner.os == 'macOS' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python3 .github/scripts/atualiza.py

      # O `brew` só audita casks de um tap instalado: o checkout vira o tap `zeebxteam/tap`.
      - name: Confere os casks
        run: |
          eval "$($(command -v brew || echo /home/linuxbrew/.linuxbrew/bin/brew) shellenv)"
          tap="$(brew --repository)/Library/Taps/zeebxteam/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew style --cask Casks/*.rb
          brew audit --cask --online zeebxteam/tap/zeebx-qt zeebxteam/tap/zeebx

      - name: Commita
        if: runner.os == 'macOS' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git diff --quiet && { echo "nada mudou"; exit 0; }
          versao=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/zeebx-qt.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Os casks sobem para a $versao"
          git push
